services:

  # Nginx Web Server
  nginx:
    image: nginx:stable
    container_name: student_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - student_network

  # Apache + PHP Application
  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: student_app
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./src:/var/www/html
      - ./storage/uploads:/var/www/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student_network

  # MySQL Database
  db:
    image: mysql:8.4
    container_name: student_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - student_network

  # phpMyAdmin Database Management
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: student_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student_network

# Persistent Storage
volumes:
  mysql_data:

# Internal Docker Network
networks:
  student_network:
    driver: bridge
